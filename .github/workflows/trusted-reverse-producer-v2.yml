name: Trusted reverse producer v2

on:
  workflow_call:
    inputs:
      candidate_sha:
        description: Full immutable candidate commit SHA in this repository.
        required: true
        type: string
      candidate_ref:
        description: Immutable candidate ref recorded in the final receipt.
        required: true
        type: string
      candidate_tree:
        description: Full immutable candidate tree SHA expected at candidate_sha.
        required: true
        type: string

# No repository-wide write token is available. Job-specific permissions below
# are deliberately narrower and every job uses a GitHub-hosted macOS runner.
permissions: {}

env:
  TRUSTED_REPOSITORY: tonyaiuser/babata-board

concurrency:
  group: trusted-reverse-producer-v2-${{ github.repository }}-${{ inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare-untrusted-candidate
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PIP_NO_CACHE_DIR: "1"
      ARTIFACT_NAME: raw-reverse-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout trusted workflow implementation only
        # actions/checkout@v7.0.1, GitHub API /releases/latest and /git/ref/tags/v7.0.1 verified 2026-08-09.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact untrusted candidate SHA
        # actions/checkout@v7.0.1, GitHub API /releases/latest and /git/ref/tags/v7.0.1 verified 2026-08-09.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Verify called workflow authority and seal its blob identity
        shell: bash
        env:
          CALLER_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_REF: ${{ job.workflow_ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test "$CALLER_REPOSITORY" = "$TRUSTED_REPOSITORY"
          test "$WORKFLOW_REPOSITORY" = "$TRUSTED_REPOSITORY"
          test "$WORKFLOW_REF" = "$TRUSTED_REPOSITORY/.github/workflows/trusted-reverse-producer-v2.yml@refs/heads/main"
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(/usr/bin/git -C trusted rev-parse HEAD)" = "$WORKFLOW_SHA"
          WORKFLOW_BLOB=$(/usr/bin/git -C trusted rev-parse "$WORKFLOW_SHA:.github/workflows/trusted-reverse-producer-v2.yml")
          [[ "$WORKFLOW_BLOB" =~ ^[0-9a-f]{40}$ ]]
          printf 'WORKFLOW_BLOB=%s\n' "$WORKFLOW_BLOB" >> "$GITHUB_ENV"

      - name: Fail closed unless candidate checkout is exactly the declared commit and tree
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.candidate_sha }}
          EXPECTED_TREE: ${{ inputs.candidate_tree }}
          CALLER_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
        run: |
          set -euo pipefail
          test "$CALLER_REPOSITORY" = "$TRUSTED_REPOSITORY"
          test "$WORKFLOW_REPOSITORY" = "$TRUSTED_REPOSITORY"
          test "$CALLER_REPOSITORY" = "$WORKFLOW_REPOSITORY"
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
          test "$(/usr/bin/git -C candidate rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(/usr/bin/git -C candidate rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"

      - name: Run fixed trusted prepare/build-test wrapper
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.candidate_sha }}
          EXPECTED_TREE: ${{ inputs.candidate_tree }}
          CANDIDATE_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          SIGNER_WORKFLOW_REF: ${{ job.workflow_ref }}
          BUILDER_AUTHORITY_REF: refs/heads/main
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/python3 -I -B -S trusted/.github/reverse_producer_v2/prepare_candidate.py \
            --candidate-dir "$GITHUB_WORKSPACE/candidate" \
            --output-dir "$RUNNER_TEMP/raw-reverse-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --source-commit "$EXPECTED_COMMIT" \
            --source-tree "$EXPECTED_TREE" \
            --candidate-repository "$CANDIDATE_REPOSITORY" \
            --workflow-repository "$WORKFLOW_REPOSITORY" \
            --signer-workflow-ref "$SIGNER_WORKFLOW_REF" \
            --builder-authority-ref "$BUILDER_AUTHORITY_REF" \
            --workflow-commit "$WORKFLOW_SHA" \
            --workflow-blob "$WORKFLOW_BLOB" \
            --timeout-seconds 1200
          mkdir -m 700 -p out
          cp "$RUNNER_TEMP/raw-reverse-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/raw-reverse.tar" out/raw-reverse.tar
          cp "$RUNNER_TEMP/raw-reverse-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/raw-reverse-receipt.json" out/raw-reverse-receipt.json
          test "$(find out -type f | wc -l | tr -d ' ')" = 2
          test ! -L out/raw-reverse.tar
          test ! -L out/raw-reverse-receipt.json

      - name: Upload the sole hostile raw archive and receipt
        # actions/upload-artifact@v7.0.1, GitHub API /releases/latest and /git/ref/tags/v7.0.1 verified 2026-08-09.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            out/raw-reverse.tar
            out/raw-reverse-receipt.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  finalize:
    name: finalize-without-candidate
    needs: prepare
    runs-on: macos-14
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: write
      id-token: write
    env:
      PIP_NO_CACHE_DIR: "1"
      ARTIFACT_NAME: raw-reverse-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout only the trusted workflow implementation
        # actions/checkout@v7.0.1, GitHub API /releases/latest and /git/ref/tags/v7.0.1 verified 2026-08-09.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Verify called workflow authority and seal its blob identity
        shell: bash
        env:
          CALLER_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_REF: ${{ job.workflow_ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test "$CALLER_REPOSITORY" = "$TRUSTED_REPOSITORY"
          test "$WORKFLOW_REPOSITORY" = "$TRUSTED_REPOSITORY"
          test "$WORKFLOW_REF" = "$TRUSTED_REPOSITORY/.github/workflows/trusted-reverse-producer-v2.yml@refs/heads/main"
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(/usr/bin/git -C trusted rev-parse HEAD)" = "$WORKFLOW_SHA"
          WORKFLOW_BLOB=$(/usr/bin/git -C trusted rev-parse "$WORKFLOW_SHA:.github/workflows/trusted-reverse-producer-v2.yml")
          [[ "$WORKFLOW_BLOB" =~ ^[0-9a-f]{40}$ ]]
          printf 'WORKFLOW_BLOB=%s\n' "$WORKFLOW_BLOB" >> "$GITHUB_ENV"

      - name: Fetch exact candidate Git objects without executing candidate content
        # actions/checkout@v7.0.1, GitHub API /releases/latest and /git/ref/tags/v7.0.1 verified 2026-08-09.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.candidate_sha }}
          path: candidate-object-db
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false

      - name: Download raw artifact bytes only
        # actions/download-artifact@v8.0.1, GitHub API /releases/latest and /git/ref/tags/v8.0.1 verified 2026-08-09.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: raw

      - name: Enforce the raw artifact's two-file envelope
        shell: bash
        run: |
          set -euo pipefail
          test -d raw
          test "$(find raw -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" = 2
          test "$(find raw -mindepth 1 -maxdepth 1 ! -type f | wc -l | tr -d ' ')" = 0
          test -f raw/raw-reverse.tar
          test -f raw/raw-reverse-receipt.json
          test ! -L raw/raw-reverse.tar
          test ! -L raw/raw-reverse-receipt.json

      - name: Create immutable trusted provenance binding
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          CANDIDATE_TREE: ${{ inputs.candidate_tree }}
          SOURCE_REPOSITORY_ID: ${{ github.repository_id }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          SIGNER_REPOSITORY: ${{ job.workflow_repository }}
          SIGNER_WORKFLOW_REF: ${{ job.workflow_ref }}
          SIGNER_COMMIT: ${{ job.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          RUNNER_OS: ${{ runner.os }}
        run: |
          set -euo pipefail
          : "${ImageOS:?missing GitHub-hosted image name}"
          : "${ImageVersion:?missing GitHub-hosted image version}"
          export RUNNER_IMAGE="$ImageOS-$ImageVersion"
          mkdir -m 700 -p final
          /usr/bin/python3 -I -B -S - <<'PY'
          import json
          import os
          import pathlib
          import subprocess

          def output(argv):
              return subprocess.check_output(argv, text=True, stderr=subprocess.DEVNULL).strip()

          document = {
              "schema": "spspy.trusted-reverse-producer-v2.binding",
              "source": {
                  "id": os.environ["SOURCE_REPOSITORY_ID"],
                  "repository": os.environ["SOURCE_REPOSITORY"],
                  "commit": os.environ["SOURCE_COMMIT"],
                  "ref": os.environ["SOURCE_REF"],
              },
              "candidate": {
                  "commit": os.environ["CANDIDATE_SHA"],
                  "ref": os.environ["CANDIDATE_REF"],
                  "tree": os.environ["CANDIDATE_TREE"],
              },
              "signer": {
                  "repository": os.environ["SIGNER_REPOSITORY"],
                  "workflow_path": ".github/workflows/trusted-reverse-producer-v2.yml",
                  "workflow_ref": os.environ["SIGNER_WORKFLOW_REF"],
                  "commit": os.environ["SIGNER_COMMIT"],
                  "blob": os.environ["WORKFLOW_BLOB"],
              },
              "run": {
                  "id": os.environ["RUN_ID"],
                  "attempt": os.environ["RUN_ATTEMPT"],
                  "finalize_job": "finalize-without-candidate",
                  "prepare_result": os.environ["PREPARE_RESULT"],
              },
              "artifact": {"name": "raw-reverse-%s-%s" % (os.environ["RUN_ID"], os.environ["RUN_ATTEMPT"])},
              "runner": {"os": os.environ["RUNNER_OS"], "image": os.environ["RUNNER_IMAGE"]},
              "tools": {"python": output(["/usr/bin/python3", "--version"]), "tar": output(["/usr/bin/tar", "--version"]).splitlines()[0]},
              "cache": {"shared": False, "enabled": False},
              "test_matrix": {
                  "command": "/usr/bin/python3 -I -B -S -m unittest discover -s tests -p test_*.py",
                  "prepare_boundary": "only needs.prepare.result=success proves the fixed Job A test passed; wrapper receipt remains hashed hostile source evidence",
                  "prepare_result": os.environ["PREPARE_RESULT"],
                  "finalize": "stdlib streaming validator plus trusted release policy",
                  "runner": "macos-14",
              },
          }
          pathlib.Path("final/binding.json").write_text(json.dumps(document, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          PY

      - name: Validate raw bytes and rebuild deterministic canonical tar
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -B -S trusted/.github/reverse_producer_v2/validate.py \
            --input raw/raw-reverse.tar \
            --source-receipt raw/raw-reverse-receipt.json \
            --binding final/binding.json \
            --policy trusted/.github/reverse_producer_v2/policy.json \
            --candidate-git-dir candidate-object-db/.git \
            --output final/canonical-reverse.tar \
            --receipt final/canonical-reverse-receipt.json
          test -s final/canonical-reverse.tar
          test -s final/canonical-reverse-receipt.json

      - name: Attest the finalizer's canonical tar and canonical receipt
        # actions/attest@v4.2.2, GitHub API /releases/latest and /git/ref/tags/v4.2.2 verified 2026-08-09.
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            final/canonical-reverse.tar
            final/canonical-reverse-receipt.json

      - name: Upload trusted canonical release evidence
        # actions/upload-artifact@v7.0.1, GitHub API /releases/latest and /git/ref/tags/v7.0.1 verified 2026-08-09.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: canonical-reverse-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            final/canonical-reverse.tar
            final/canonical-reverse-receipt.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
