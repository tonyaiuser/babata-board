function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function safeUrl(value) {
  if (typeof value !== 'string' || !value.trim()) return '';
  try {
    const parsed = new URL(value.trim());
    return (parsed.protocol === 'http:' || parsed.protocol === 'https:') ? parsed.href : '';
  } catch (_) {
    return '';
  }
}

function finiteNumber(value, fallback = 0) {
  const number = Number(value);
  return Number.isFinite(number) ? number : fallback;
}

  [/gel liner/i, '防水眼线胶笔'],
  [/hair removal cream/i, '温和脱毛膏'],
  [/marble/i, '大理石纹地面漆'],
  [/tile wax|tire wax/i, '轮胎光亮蜡'],
  [/mug/i, '马克杯'],
  [/oral irrigator|water flosser/i, '便携冲牙器'],
  [/camping.*bag|storage bag/i, '户外露营收纳袋'],
  [/PTZ camera/i, '太阳能 PTZ 摄像头'],
  [/fake.*dress|二件套|blatt/i, '仿两件套连衣裙'],
  [/lace.*dress|babydoll/i, '镂空蕾丝连衣裙'],
  [/cloud slide|non-slip.*sole/i, '厚底防滑云朵拖鞋'],
];

function getChineseTitle(title) {
  title = String(title || '');
  // Remove emojis and promo noise for matching
  const clean = title.replace(/[^ -~À-ɏ]/g, '').trim();
  for (const [re, cn] of CN_MAP) {
    if (re.test(clean) || re.test(title)) return cn;
  }
  // Fallback: extract main noun
  return extractNoun(clean);
}

function extractNoun(t) {
  const cleaned = t.replace(/\d+%\s*OFF|SALE|Rabatt|FREE|LIMITED|LAST DAY|HOT|🔥|⚡|💎|🏆|💥|✨|⏳|\bBUY\b|\bGET\b/gi,'').trim();
  const words = cleaned.split(/[\s,\-–|]+/).filter(w => w.length > 2).slice(0,3);
  return words.join(' ') || t.slice(0,30);
}

function getCategory(title) {
  title = String(title || '');
  for (const cat of CATS.slice(1)) {
    if (cat.match(title)) return cat.id;
  }
  return 'other';
}

function getCatLabel(id) {
  const c = CATS.find(x => x.id === id);
  return c ? c.label : '📦 其他';
}

function scoreColor(s) {
  if (s >= 35) return 'score-high';
  if (s >= 22) return 'score-mid';
  return 'score-low';
}

// ISO 货币代码 → 符号（未收录的直接显示代码）
const CURRENCY_SYMBOLS = {
  USD: '$', GBP: '£', EUR: '€', CAD: 'CA$', AUD: 'A$', NZD: 'NZ$',
  JPY: '¥', CNY: '¥', CHF: 'CHF ', SEK: 'kr ', NOK: 'kr ', DKK: 'kr ',
  PLN: 'zł ', MXN: 'MX$', BRL: 'R$', INR: '₹', AED: 'AED ', SAR: 'SAR ',
};
function currencySymbol(code) {
  if (!code) return '';
  code = String(code).toUpperCase();
  return CURRENCY_SYMBOLS[code] || (code + ' ');
}

function rankBadge(i) {
  if (i === 0) return '<span class="rank rank-1">🥇 #1</span>';
  if (i === 1) return '<span class="rank rank-2">🥈 #2</span>';
  if (i === 2) return '<span class="rank rank-3">🥉 #3</span>';
  if (i < 10) return `<span class="rank">#${i+1}</span>`;
  return '';
}

function stripEmoji(s) {
  return String(s || '').replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}]+/gu, '').replace(/\s+/g,' ').trim();
}

// Gradient palettes for placeholders
const GRADIENTS = [
  ['#e0e7ff','#c7d2fe'],['#fce7f3','#fbcfe8'],['#ecfdf5','#a7f3d0'],
  ['#fef3c7','#fde68a'],['#eff6ff','#bfdbfe'],['#f5f3ff','#ddd6fe'],
  ['#fff1f2','#fecdd3'],['#f0fdfa','#99f6e4'],
];
function cardGradient(i) {
  const [a,b] = GRADIENTS[i % GRADIENTS.length];
  return `background: linear-gradient(135deg, ${a} 0%, ${b} 100%);`;
}

// Category icons
const CAT_ICONS = {
  beauty:'💄',clothing:'👗',home:'🏠',auto:'🚗',electronics:'📱',tools:'🔧',all:'📦'
};
function catIcon(id) { return CAT_ICONS[id] || '📦'; }

// SVG sparkline for trend data
function sparkline(trend) {
  if (!trend || Object.keys(trend).length < 2) return '';
  const entries = Object.keys(trend).sort()
    .map(d => [String(d), Number(trend[d])])
    .filter(([, value]) => Number.isFinite(value));
  if (entries.length < 2) return '';
  const dates = entries.map(([day]) => day);
  const vals = entries.map(([, value]) => value);
  const max = Math.max(...vals, 1);
  const min = Math.min(...vals, 0);
  const range = max - min || 1;
  const w = 80, h = 28, pad = 3;
  const pts = vals.map((v, i) => {
    const x = pad + (i / (vals.length - 1)) * (w - 2 * pad);
    const y = h - pad - ((v - min) / range) * (h - 2 * pad);
    return [x, y];
  });
  const polyline = pts.map(([x,y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
  const last = pts[pts.length - 1];
  const color = vals[vals.length-1] >= vals[0] ? '#10b981' : '#ef4444';
  const lastVal = vals[vals.length-1];
  const diff = vals[vals.length-1] - vals[0];
  const arrow = diff > 0 ? '\u2191' : diff < 0 ? '\u2193' : '';
  const title = escapeHtml(dates.map((d,i)=>d.slice(5)+': '+vals[i]+'家').join('\n'));
  return `<span class="trend-wrap" title="${title}">
    <svg width="${w}" height="${h}" style="vertical-align:middle;">
      <polyline points="${polyline}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.5" fill="${color}"/>
    </svg>
    <span style="color:${color};font-weight:600;">${arrow}${lastVal}</span>
  </span>`;
}

let activecat = 'all';

function filtered() {
  let data = RAW_DATA.map((p,i)=>({...p,_idx:i,_cat:getCategory(String(p.title || ''))}));

  if (activecat !== 'all') {
    const catDef = CATS.find(x=>x.id===activecat);
    if (catDef) data = data.filter(p => catDef.match(String(p.title || '')));
  }
  data.sort((a,b) => finiteNumber(b.dashboard_priority) - finiteNumber(a.dashboard_priority) || (b.is_new?1:0) - (a.is_new?1:0) || finiteNumber(b.score) - finiteNumber(a.score));
  return data;
}

function render() {
  const data = filtered();
  document.getElementById('result-count').textContent = data.length;
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  if (!data.length) { grid.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display='none';

  grid.innerHTML = data.slice(0,100).map((p, vi) => {
    const orig_i = p._idx;
    const rawTitle = String(p.title || '');
    const cn = escapeHtml(getChineseTitle(rawTitle));
    const clean = stripEmoji(rawTitle);
    const safeTitle = escapeHtml(clean || rawTitle);
    const score = finiteNumber(p.score);
    const sitesCount = finiteNumber(p.sites_count);
    const flagshipCount = finiteNumber(p.flagship_count);
    const hasFlag = flagshipCount > 0;
    const priceNum = parseFloat(p.price);
    const hasPrice = Number.isFinite(priceNum);
    const currency = escapeHtml(currencySymbol(p.currency));
    const pubDate = String(p.published_at || p.date || '').slice(0, 10);
    const dateStr = escapeHtml(pubDate.slice(5)); // MM-DD
    const delta = Math.max(finiteNumber(p.delta_1d), finiteNumber(p.spread_delta));
    const fbCount = finiteNumber(p.fb_hit_count);
    const changeLabel = escapeHtml(p.change_label || '');
    const imageUrl = safeUrl(p.image_url);
    const sampleUrl = safeUrl(p.sample_url);

    const imgHtml = imageUrl
      ? `<img class="card-img" src="${escapeHtml(imageUrl)}" alt="${safeTitle}" loading="lazy" data-fallback-index="${orig_i}" data-fallback-icon="${escapeHtml(catIcon(p._cat))}">`
      : `<div class="card-img-placeholder" style="${cardGradient(orig_i)}"><span>${catIcon(p._cat)}</span></div>`;
    const trendHtml = sparkline(p.trend);

    return `<div class="card${p.is_new ? ' card-new' : ''}">
      <div class="card-img-wrap">
        ${rankBadge(vi)}
        ${p.is_new ? '<span class="badge-new">🆕 NEW</span>' : ''}
        ${imgHtml}
      </div>
      <div class="card-body">
        <div class="card-top">
          <div class="card-title" title="${safeTitle}">${safeTitle}</div>
          <span class="score-badge ${scoreColor(score)}">⭐ ${score}</span>
        </div>
        <div class="card-cn">🇨🇳 ${cn}</div>
        <div class="card-meta">
          ${hasPrice ? `<span class="meta-chip chip-price">💰 ${currency}${priceNum.toFixed(2)}</span>` : ''}
          <span class="meta-chip chip-sites">🏪 ${sitesCount} 家</span>
          ${hasFlag ? `<span class="meta-chip chip-flagship">⭐ ${flagshipCount} 旗舰</span>` : ''}
          ${changeLabel ? `<span class="meta-chip chip-change">${changeLabel}</span>` : ''}
          ${delta > 0 ? `<span class="meta-chip chip-growth">+${delta}站</span>` : ''}
          ${fbCount > 0 ? `<span class="meta-chip chip-fb">FB ${fbCount}</span>` : ''}
          ${p.is_lp ? `<span class="meta-chip chip-lp">LP</span>` : ''}
          <span class="meta-chip chip-date">🛒 ${dateStr}</span>
          ${trendHtml}
        </div>
        <div class="card-actions">
          ${sampleUrl ? `<a class="btn-sample" href="${escapeHtml(sampleUrl)}" target="_blank" rel="noopener noreferrer">🔗 样品链接</a>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');
  grid.querySelectorAll('img.card-img').forEach(img => {
    img.addEventListener('error', () => {
      const index = finiteNumber(img.dataset.fallbackIndex);
      const placeholder = document.createElement('div');
      placeholder.className = 'card-img-placeholder';
      placeholder.style.cssText = cardGradient(index);
      const icon = document.createElement('span');
      icon.textContent = img.dataset.fallbackIcon || '📦';
      placeholder.appendChild(icon);
      img.replaceWith(placeholder);
    }, {once: true});
  });
}

function initCatTabs() {
  const wrap = document.getElementById('cat-tabs');
  // Count per category
  const counts = {};
  RAW_DATA.forEach(p => {
    const cat = getCategory(String(p.title || ''));
    counts[cat] = (counts[cat]||0)+1;
  });
  
  const tabData = [
    ...CATS.map(c => ({...c, count: c.id==='all' ? RAW_DATA.length : (counts[c.id]||0)})),
    {id:'other', label:'📦 其他', match:()=>true, count: counts['other']||0}
  ].filter((c,i,arr) => c.id==='all' || c.count>0 || !arr.find(x=>x.id===c.id && x!==c));
  
  wrap.innerHTML = tabData.map(c =>
    `<button class="cat-tab${activecat===c.id?' active':''}" data-id="${escapeHtml(c.id)}">${escapeHtml(c.label)} <span style="opacity:.6">${finiteNumber(c.count)}</span></button>`
  ).join('');
  wrap.querySelectorAll('.cat-tab').forEach(button => {
    button.addEventListener('click', () => setcat(button.dataset.id));
  });
}

function setcat(id) {
  activecat = id;
  document.querySelectorAll('.cat-tab').forEach(t => t.classList.toggle('active', t.dataset.id===id));
  render();
}

function parseCalendarDate(value) {
  const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(value || ''));
  if (!match) return null;
  const year = Number(match[1]);
  const month = Number(match[2]);
  const day = Number(match[3]);
  const ordinal = Date.UTC(year, month - 1, day) / 86400000;
  const roundTrip = new Date(ordinal * 86400000);
  if (roundTrip.getUTCFullYear() !== year
      || roundTrip.getUTCMonth() + 1 !== month
      || roundTrip.getUTCDate() !== day) return null;
  return {year, month, day, ordinal};
}

function shanghaiCalendarDate(now = new Date()) {
  try {
    const parts = new Intl.DateTimeFormat('en-US', {
      timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit'
    }).formatToParts(now);
    const values = Object.fromEntries(parts.map(part => [part.type, part.value]));
    return `${values.year}-${values.month}-${values.day}`;
  } catch (_) {
    return '';
  }
}

function dashboardAgeStatus(sourceDate, now = new Date()) {
  const source = parseCalendarDate(sourceDate);
  const today = parseCalendarDate(shanghaiCalendarDate(now));
  if (!source) return {state: 'invalid', text: '⚠️ 数据日期无效，无法判断新鲜度'};
  if (!today) return {state: 'invalid', text: '⚠️ 上海日历时间不可用，无法判断新鲜度'};
  const ageDays = today.ordinal - source.ordinal;
  if (ageDays < 0) {
    return {state: 'future', text: `⚠️ 数据日期来自未来（${Math.abs(ageDays)} 天），请核验来源`};
  }
  if (ageDays === 0) return {state: 'fresh', text: '数据年龄 0 天 · 新鲜'};
  return {state: 'stale', text: `⚠️ 数据年龄 ${ageDays} 天 · 已过期`};
}

function initStats() {
  const total = RAW_DATA.length;
  const withFlag = RAW_DATA.filter(p=>finiteNumber(p.flagship_count)>0).length;
  const maxScore = total ? Math.max(...RAW_DATA.map(p=>finiteNumber(p.score))) : 0;
  const avgSites = total
    ? (RAW_DATA.reduce((a,p)=>a+finiteNumber(p.sites_count),0)/total).toFixed(1)
    : '0.0';
  const newCount = RAW_DATA.filter(p=>p.is_new).length;
  const changeCount = RAW_DATA.filter(p=>(p.dashboard_priority||0)>0).length;

  document.getElementById('stats-row').innerHTML = `
    <div class="stat-pill">📦 <strong>${total}</strong> 个商品</div>
    <div class="stat-pill">⭐ 最高分 <strong>${maxScore}</strong></div>
    <div class="stat-pill">🏪 平均铺货 <strong>${avgSites}</strong> 家</div>
    <div class="stat-pill">🔥 旗舰命中 <strong>${withFlag}</strong> 个</div>
    ${changeCount ? `<div class="stat-pill">📈 有变化 <strong>${changeCount}</strong> 个</div>` : ''}
    ${newCount ? `<div class="stat-pill">🆕 新品 <strong>${newCount}</strong> 个</div>` : ''}
  `;
  const provenanceTarget = document.getElementById('dashboard-provenance');
  const ageTarget = document.getElementById('data-age-status');
  const sourceDate = provenanceTarget?.dataset.sourceDate
    || document.querySelector('meta[name="spspy-source-date"]')?.content || '';
  const ageStatus = dashboardAgeStatus(sourceDate);
  ageTarget.textContent = ageStatus.text;
  ageTarget.dataset.state = ageStatus.state;

  // Update date range in header
  const dates = RAW_DATA.map(p=>p.date).filter(Boolean);
  if (dates.length) {
    const sorted = [...new Set(dates)].sort();
    document.getElementById('header-meta').textContent =
      '数据来源：热榜 · 最近 ' + sorted.length + ' 天汇总 · ' + sorted[0] + ' ~ ' + sorted[sorted.length-1];
  }
}

// Init
initStats();
initCatTabs();
render();
</script>
