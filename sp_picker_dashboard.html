function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function safeUrl(value) {
  if (typeof value !== 'string' || !value.trim()) return '';
  try {
    const parsed = new URL(value.trim());
    return (parsed.protocol === 'http:' || parsed.protocol === 'https:') ? parsed.href : '';
  } catch (_) {
    return '';
  }
}

function finiteNumber(value, fallback = 0) {
  const number = Number(value);
  return Number.isFinite(number) ? number : fallback;
}

function getChineseTitle(title) {
  title = String(title || '');
  // Remove emojis and promo noise for matching
  const clean = title.replace(/[^ -~À-ɏ]/g, '').trim();
  for (const [re, cn] of CN_MAP) {
    if (re.test(clean) || re.test(title)) return cn;
  }
  // Fallback: extract main noun
  return extractNoun(clean);
}

function extractNoun(t) {
  const cleaned = t.replace(/\d+%\s*OFF|SALE|Rabatt|FREE|LIMITED|LAST DAY|HOT|🔥|⚡|💎|🏆|💥|✨|⏳|\bBUY\b|\bGET\b/gi,'').trim();
  const words = cleaned.split(/[\s,\-–|]+/).filter(w => w.length > 2).slice(0,3);
  return words.join(' ') || t.slice(0,30);
}

function getCategory(title) {
  title = String(title || '');
  for (const cat of CATS.slice(1)) {
    if (cat.match(title)) return cat.id;
  }
  return 'other';
}

function getCatLabel(id) {

function scoreColor(s) {

// SVG sparkline for trend data
function sparkline(trend) {
  if (!trend || Object.keys(trend).length < 2) return '';
  const entries = Object.keys(trend).sort()
    .map(d => [String(d), Number(trend[d])])
    .filter(([, value]) => Number.isFinite(value));
  if (entries.length < 2) return '';
  const dates = entries.map(([day]) => day);
  const vals = entries.map(([, value]) => value);
  const max = Math.max(...vals, 1);
  const min = Math.min(...vals, 0);
  const range = max - min || 1;
  const w = 80, h = 28, pad = 3;
  const pts = vals.map((v, i) => {
    const x = pad + (i / (vals.length - 1)) * (w - 2 * pad);
    const y = h - pad - ((v - min) / range) * (h - 2 * pad);
    return [x, y];
  });
  const polyline = pts.map(([x,y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
  const last = pts[pts.length - 1];
  const color = vals[vals.length-1] >= vals[0] ? '#10b981' : '#ef4444';
  const lastVal = vals[vals.length-1];
  const diff = vals[vals.length-1] - vals[0];
  const arrow = diff > 0 ? '\u2191' : diff < 0 ? '\u2193' : '';
  const title = escapeHtml(dates.map((d,i)=>d.slice(5)+': '+vals[i]+'家').join('\n'));
  return `<span class="trend-wrap" title="${title}">
    <svg width="${w}" height="${h}" style="vertical-align:middle;">
      <polyline points="${polyline}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.5" fill="${color}"/>
    </svg>
    <span style="color:${color};font-weight:600;">${arrow}${lastVal}</span>
  </span>`;
}

}

function parseCalendarDate(value) {
  const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(value || ''));
  if (!match) return null;
  const year = Number(match[1]);
  const month = Number(match[2]);
  const day = Number(match[3]);
  const ordinal = Date.UTC(year, month - 1, day) / 86400000;
  const roundTrip = new Date(ordinal * 86400000);
  if (roundTrip.getUTCFullYear() !== year
      || roundTrip.getUTCMonth() + 1 !== month
      || roundTrip.getUTCDate() !== day) return null;
  return {year, month, day, ordinal};
}

function shanghaiCalendarDate(now = new Date()) {
  try {
    const parts = new Intl.DateTimeFormat('en-US', {
      timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit'
    }).formatToParts(now);
    const values = Object.fromEntries(parts.map(part => [part.type, part.value]));
    return `${values.year}-${values.month}-${values.day}`;
  } catch (_) {
    return '';
  }
}

function dashboardAgeStatus(sourceDate, now = new Date()) {
  const source = parseCalendarDate(sourceDate);
  const today = parseCalendarDate(shanghaiCalendarDate(now));
  if (!source) return {state: 'invalid', text: '⚠️ 数据日期无效，无法判断新鲜度'};
  if (!today) return {state: 'invalid', text: '⚠️ 上海日历时间不可用，无法判断新鲜度'};
  const ageDays = today.ordinal - source.ordinal;
  if (ageDays < 0) {
    return {state: 'future', text: `⚠️ 数据日期来自未来（${Math.abs(ageDays)} 天），请核验来源`};
  }
  if (ageDays === 0) return {state: 'fresh', text: '数据年龄 0 天 · 新鲜'};
  return {state: 'stale', text: `⚠️ 数据年龄 ${ageDays} 天 · 已过期`};
}

function initStats() {
  const total = RAW_DATA.length;
  const withFlag = RAW_DATA.filter(p=>finiteNumber(p.flagship_count)>0).length;
  const maxScore = total ? Math.max(...RAW_DATA.map(p=>finiteNumber(p.score))) : 0;
  const avgSites = total
    ? (RAW_DATA.reduce((a,p)=>a+finiteNumber(p.sites_count),0)/total).toFixed(1)
    : '0.0';
  const newCount = RAW_DATA.filter(p=>p.is_new).length;
  const changeCount = RAW_DATA.filter(p=>(p.dashboard_priority||0)>0).length;

  document.getElementById('stats-row').innerHTML = `
    <div class="stat-pill">📦 <strong>${total}</strong> 个商品</div>
    <div class="stat-pill">⭐ 最高分 <strong>${maxScore}</strong></div>
    <div class="stat-pill">🏪 平均铺货 <strong>${avgSites}</strong> 家</div>
    <div class="stat-pill">🔥 旗舰命中 <strong>${withFlag}</strong> 个</div>
    ${changeCount ? `<div class="stat-pill">📈 有变化 <strong>${changeCount}</strong> 个</div>` : ''}
    ${newCount ? `<div class="stat-pill">🆕 新品 <strong>${newCount}</strong> 个</div>` : ''}
  `;
  const provenanceTarget = document.getElementById('dashboard-provenance');
  const ageTarget = document.getElementById('data-age-status');
  const sourceDate = provenanceTarget?.dataset.sourceDate
    || document.querySelector('meta[name="spspy-source-date"]')?.content || '';
  const ageStatus = dashboardAgeStatus(sourceDate);
  ageTarget.textContent = ageStatus.text;
  ageTarget.dataset.state = ageStatus.state;

  // Update date range in header
  const dates = RAW_DATA.map(p=>p.date).filter(Boolean);
  if (dates.length) {
    const sorted = [...new Set(dates)].sort();
    document.getElementById('header-meta').textContent =
      '数据来源：热榜 · 最近 ' + sorted.length + ' 天汇总 · ' + sorted[0] + ' ~ ' + sorted[sorted.length-1];
  }
}
